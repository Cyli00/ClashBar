name: 错误反馈
description: 提交 Rust + Tauri 客户端问题
title: '[Bug] '
labels: ['bug']
body:
  - type: checkboxes
    id: ensure
    attributes:
      label: 提交前检查
      options:
        - label: 我已在 [Issue Tracker](https://github.com/Cyli00/ClashBar/issues) 搜索过相同问题。
          required: false
        - label: 我提供的配置、日志和截图已经移除订阅地址、节点密码、控制器密钥等敏感信息。
          required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11 x64
        - Windows 10 x64
        - 其它（请说明编译与运行环境）
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: 系统、ClashBar 和 mihomo 版本
      description: 应用底部显示 ClashBar 与 mihomo 版本；另请提供 Windows 版本及显示缩放比例。
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 实际行为与预期行为
      description: 请说明使用本机还是远程控制器，是否开启系统代理或 TUN。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 重现步骤
      description: 列出从启动应用到出现问题的操作。
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: 最小配置（按需）
      description: 使用临时节点或 DIRECT 示例；不要粘贴真实订阅、密码或完整个人配置。
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: 相关日志与截图
      description: 从日志标签复制相关记录，或附上应用数据目录 logs 中经过脱敏的片段。
      render: text
