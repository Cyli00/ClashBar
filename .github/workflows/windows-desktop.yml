name: Windows Desktop

on:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-desktop.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend unit and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Browser screenshots and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-evidence
          path: desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7
  windows:
    name: Windows x64 checks and installer
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: npm ci
      - run: npm run build
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Rust domain and Windows proxy tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
      - name: WinINet proxy restore smoke on disposable runner
        env:
          CLASHBAR_PROXY_INTEGRATION_TEST: '1'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features windows_wininet_roundtrip_restores_actual_settings -- --ignored --test-threads=1
      - name: Rust desktop checks
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis -- --locked
      - name: Native packaged popup smoke on disposable runner
        shell: pwsh
        run: ./tests/windows-popup-smoke.ps1
      - name: Native popup rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-popup-evidence
          path: desktop/test-results/native-popup.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: clashbar-windows-x64
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Capture resolved Rust dependency lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-dependency-lock
          path: desktop/src-tauri/Cargo.lock
          if-no-files-found: ignore
