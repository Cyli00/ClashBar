[package]
name = "clashbar-desktop"
version = "0.1.0"
description = "Windows desktop companion for the mihomo proxy core"
authors = ["ClashBar contributors"]
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-only"

[lib]
name = "clashbar_desktop"
crate-type = ["rlib"]

[[bin]]
name = "clashbar-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-autostart", "dep:tauri-plugin-clipboard-manager"]

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dependencies]
tauri = { version = "2", optional = true, features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
url = "2"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
base64 = "0.22"
quick-xml = "0.41"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rand = "0.8"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinInet", "Win32_Networking_WinSock", "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
